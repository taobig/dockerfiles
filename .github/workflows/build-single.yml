name: Build Single Image

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: "PHP version to build"
        required: true
        type: choice
        options:
          - php82 # 必须和 Dockerfile 目录名的后缀一致
          - php83
          - php84
      push_to_registry:
        description: "Push to Docker Hub"
        required: false
        type: boolean
        default: false

env:
  DOCKERFILE_DIR: ubuntu_nginx_${{ github.event.inputs.php_version }}
  IMAGE_NAME: taobig/nginx-${{ github.event.inputs.php_version }}  # Docker Hub 镜像名称，如 taobig/nginx-php84

jobs:
  # 使用矩阵策略在不同架构的原生 runners 上并行构建
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04        # AMD64 原生 runner
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm    # ARM64 原生 runner (GitHub 免费提供)
            platform: linux/arm64
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ github.event.inputs.push_to_registry == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.DOCKERFILE_DIR }}
          file: ./${{ env.DOCKERFILE_DIR }}/Dockerfile
          platforms: ${{ matrix.platform }}
          pull: true  # 强制拉取最新的 base image
          # push-by-digest 只能给仓库名，带 :tag 会报 can't push tagged ref by digest
          tags: ${{ github.event.inputs.push_to_registry == 'true' && env.IMAGE_NAME || format('{0}:latest-{1}', env.IMAGE_NAME, matrix.arch) }}
          provenance: false  # 避免 OCI digest 与 registry digest 不一致，merge 时找不到镜像
          outputs: ${{ github.event.inputs.push_to_registry == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE_NAME) || 'type=docker' }}

      - name: Export digest
        if: ${{ github.event.inputs.push_to_registry == 'true' }}
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ github.event.inputs.push_to_registry == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # 合并多架构镜像并推送到 registry
  merge:
    runs-on: ubuntu-24.04
    if: ${{ github.event.inputs.push_to_registry == 'true' }}
    needs: build

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:latest
